*{box-sizing:border-box}
body{margin:0;background:#F7F8FA;font-family:'DM Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#131516;-webkit-font-smoothing:antialiased}
a{color:#00274C;text-decoration:none}a:hover{color:#2A5993}
button,select,input,textarea{font-family:inherit}
.muted12{font-size:12px;color:#6B7280;line-height:18px}.muted13{font-size:13px;color:#6B7280;line-height:19.5px}
.top{background:#fff}
.strip{background:#FAFAFA;border-bottom:1px solid #F0F0F0;display:flex;align-items:center;gap:8px;padding:6px 40px}
.locsel{border:0;background:transparent;font-size:12px;font-weight:600;color:#00274C;cursor:pointer}
.strip-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.rolesel{font-size:12px;font-weight:600;color:#00274C;background:#fff;border:1px solid #E5E7EB;border-radius:999px;padding:4px 12px;cursor:pointer}
.bar{display:flex;justify-content:space-between;align-items:center;gap:24px;padding:14px 40px;min-height:67px}
.brand{font-size:18px;font-weight:700;letter-spacing:1.8px;color:#00274C;white-space:nowrap}
.navs{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:8px 22px}
.nav{font-size:14px;font-weight:500;color:#6B7280;white-space:nowrap}.nav.on{font-weight:700;color:#00274C}
.wo{border:0;background:#00274C;color:#fff;border-radius:999px;padding:12px 26px;font-size:14px;font-weight:600;cursor:pointer}.wo:hover{background:#003A6E}


.hero{background:#00274C;display:flex;justify-content:center}
.hero-in{width:100%;max-width:1200px;padding:28px;display:flex;gap:32px;align-items:center;flex-wrap:wrap;min-height:520px}
.hero-l{flex:1 1 520px;display:flex;flex-direction:column;gap:20px;align-items:flex-start;padding:40px 0}
.kicker{font-size:24px;font-weight:900;line-height:1.35;color:#FFCB05}
.hero h1{margin:0;font-size:64px;font-weight:700;line-height:1.08;letter-spacing:-1.6px;color:#fff}
.today{font-size:20px;font-weight:500;line-height:30px;color:rgba(255,255,255,.78)}
.vehsel{border:0;border-radius:12px;padding:10px 14px;font-size:14px;color:#00274C;min-width:300px}
.btnrow{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
.btn-y{border:0;cursor:pointer;background:#FFCB05;color:#131516;border-radius:999px;padding:14px 28px;font-size:14px;font-weight:600}.btn-y:hover{background:#FFD633}
.btn-o{cursor:pointer;background:#fff;color:#00274C;border:.77px solid #E5E7EB;border-radius:999px;padding:14px 28px;font-size:14px;font-weight:600}
.btn-dis{border:0;background:#F3F4F6;color:#9CA3AF;border-radius:999px;padding:14px 28px;font-size:14px;font-weight:700;cursor:pointer}
.card{width:390px;max-width:100%;border-radius:18px;background:#fff;border:.77px solid #E5E7EB;padding:28px 30px}
.card.flat{width:100%}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
.card-h span{font-size:22px;font-weight:700;line-height:33px;color:#131516}.card-h em{font-style:normal;font-size:12px;color:#9CA3AF;padding-top:8px}
.fact{display:grid;grid-template-columns:92px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid #F0F0F0;font-size:13px;line-height:19.5px}
.fact span{color:#6B7280}.fact b{font-weight:500;color:#131516}
.card-acts{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.ack{border:0;border-radius:999px;padding:15px;font-size:14px;font-weight:700;background:#FFCB05;color:#00274C;cursor:pointer}.ack.done{background:#EDF7F1;color:#2A7D46;cursor:default}
.cont{border-radius:999px;padding:13px;font-size:14px;font-weight:600;background:#fff;border:.77px solid #E5E7EB;color:#6B7280;cursor:not-allowed}.cont.go{background:#00274C;border-color:#00274C;color:#fff;cursor:pointer}
.issues{padding-top:16px;font-size:13px;color:#6B7280}.issues a{font-weight:700}
.empty{font-size:14px;color:#6B7280;line-height:1.55;margin:6px 0}
.sec{width:100%;max-width:1200px;margin:0 auto;padding:72px 28px 0}.sec.first{padding-top:32px}
.sec:last-child{padding-bottom:72px}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.sec-h h2{margin:2px 0 0;font-size:30px;font-weight:700;line-height:1.2;color:#00274C}
.more{font-size:13px;font-weight:600}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:28px;margin-top:36px}
.flabel{font-size:11px;font-weight:600;letter-spacing:.66px;text-transform:uppercase;color:#9CA3AF;margin-bottom:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{cursor:pointer;border-radius:999px;padding:8px 16px;font-size:13px;font-weight:500;white-space:nowrap;background:#fff;border:.77px solid #E5E7EB;color:#374151}
.chip.on{background:#00274C;border-color:#00274C;color:#fff;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:16px;margin-top:40px}
.vcard{text-align:left;border-radius:14px;background:#fff;border:.77px solid #E5E7EB;padding:18px 18px 16px;cursor:pointer;color:inherit;font:inherit;display:block}
.vcard:hover{border-color:#00274C}.vcard.static{cursor:default}.vcard.static:hover{border-color:#E5E7EB}
.vt{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.vt b{font-size:32px;font-weight:700;line-height:32px;color:#00274C}.vt span{font-size:12px;color:#9CA3AF}
.vm{padding:6px 0;font-size:13px;font-weight:600;line-height:19.5px}.vp{padding:2px 0 14px;font-size:12px;color:#6B7280;line-height:18px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:500;line-height:18px;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:3.5px;flex-shrink:0}
.link{display:block;margin-top:12px;border:0;background:none;padding:0;color:#00274C;font-size:13px;font-weight:700;cursor:pointer}
.list{display:flex;flex-direction:column;gap:8px;margin-top:24px}
.row{display:grid;grid-template-columns:120px 1fr auto;gap:16px;align-items:baseline;text-align:left;background:#fff;border:.77px solid #E5E7EB;border-radius:14px;padding:14px 18px;font:inherit;color:inherit;cursor:pointer}
.row:hover{border-color:#00274C}.row b{color:#00274C;font-size:14px}.row span{font-size:13px}.row em{font-style:normal;font-size:12px;color:#9CA3AF}
.row.static{grid-template-columns:1fr;cursor:default}.row.static:hover{border-color:#E5E7EB}
.pagehead{width:100%;max-width:1200px;margin:0 auto;padding:56px 28px 8px}
.pagehead h1{margin:2px 0 0;font-size:44px;font-weight:700;letter-spacing:-.8px;color:#00274C}
.lede{max-width:760px;font-size:15px;line-height:1.6;color:#374151;margin:14px 0 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-top:28px}
.tile{background:#fff;border:.77px solid #E5E7EB;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.tile b{font-size:30px;font-weight:700;color:#00274C;line-height:1.1}.tile em{font-style:normal;font-size:12px;color:#6B7280}.tile.warn b{color:#C0362C}
.h2s{margin:0 0 18px;font-size:22px;font-weight:700;color:#00274C}.h3s{margin:22px 0 4px;font-size:16px;color:#00274C}
.bar-row{display:grid;grid-template-columns:150px 1fr 220px;gap:16px;align-items:center;padding:8px 0;font-size:13px}
.bar-track{background:#EEF1F4;border-radius:999px;height:14px;overflow:hidden}.bar-fill{height:100%;border-radius:999px}
.bar-row b{font-weight:600}
.evid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.ev{background:#fff;border:.77px solid #E5E7EB;border-radius:14px;padding:20px}.ev b{display:block;font-size:30px;color:#C0362C}.ev span{font-weight:600;font-size:14px}.ev p{font-size:13px;line-height:1.6;color:#374151;margin:8px 0 0}
.caveat{font-size:13px;line-height:1.6;color:#92610A;background:#FDF4DC;border-radius:12px;padding:12px 16px;margin:16px 0 0}
.table{background:#fff;border:.77px solid #E5E7EB;border-radius:14px;overflow:hidden;margin-top:16px}
.tr{display:grid;grid-template-columns:1fr auto;gap:16px;padding:12px 18px;border-bottom:1px solid #F0F0F0;font-size:13px;align-items:baseline}.tr:last-child{border-bottom:0}
.tr b{font-weight:600}.tr.c4{grid-template-columns:1.2fr 1fr 1.2fr 1.3fr}
.tr.pkr{grid-template-columns:150px 1fr 130px 130px}.tr.pkr p{margin:4px 0 0;color:#6B7280;font-size:12px;line-height:1.5}.cat{font-weight:600;color:#00274C}
.steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.step{background:#fff;border:.77px solid #E5E7EB;border-radius:14px;padding:18px}.step em{font-style:normal;display:inline-flex;width:26px;height:26px;border-radius:999px;background:#00274C;color:#fff;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-right:8px}

<script>
/* DPSS Fleet, final shell. Layout follows the Claude Design mockup; every
   record is carried over from the v15 portal. All outbound writes go through
   send(), the single seam where the real transport (Apps Script, TDX) plugs in. */
var D = window.FLEET_DATA;
var VEH = D.VEH;
var OUTBOX = [];
function send(kind, payload){
  var ref = ({assign:"AS-",check:"CK-",workorder:"WO-",service:"SV-",unavailability:"UA-","briefing-email":"BE-",notice:"NT-",feedback:"FB-",report:"RP-",stage:"ST-"}[kind]||"RF-") + new Date().getFullYear() + "-" + String(Math.floor(Math.random()*9000+1000));
  OUTBOX.push({kind:kind, ref:ref, at:new Date().toISOString(), payload:payload});
  return ref;
}

/* Every notification is a briefing email to the unit's two points of contact,
   with a link back to the portal. It leaves through send() like everything else. */
function portalLink(pg){return location.href.split("#")[0]+"#"+(pg||"home")}
function notify(campus,subject,lines,pg){
  var P=(D.POC[campus]||[]).filter(function(p){return p&&p.email});
  var email={to:P.map(function(p){return (p.name?p.name+" ":"")+"<"+p.email+">"}),subject:"DPSS Fleet briefing: "+subject,
    body:lines.concat(["","Open the portal: "+portalLink(pg)]).join("\n"),campus:campus};
  email.held=P.length<2;
  email.ref=send("briefing-email",email);
  return email;
}
function emailHTML(m){
  if(!m)return "";
  return '<div class="email"><div class="eh"><span>To</span><b>'+(m.to.length?esc(m.to.join(", ")):"No point of contact set for "+esc(m.campus))+'</b></div>'+
    '<div class="eh"><span>Subject</span><b>'+esc(m.subject)+'</b></div><pre>'+esc(m.body)+'</pre>'+
    (m.held?'<p class="caveat" style="margin:10px 0 0">Held: '+esc(m.campus)+' needs two points of contact before this briefing can go out. Technology Operations sets them in Reference.</p>':"")+'</div>';
}
var S = {
  role: "officer", loc: "Ann Arbor", page: "home",
  f: {loc:"Ann Arbor", status:"All", unit:"All", year:"All"},
  mine: null, phase: 0, acked: false, lastCheck: null,
  modal: null, ck: null, pkgUnit: "aa", pkgRole: null, aShift: null, aDay: null, now: new Date()
};

var FUEL = ["E","\u00bc","\u00bd","\u00be","Full"];
var NAV = {
  officer: [["home","Home"],["assignments","Assignments"],["wall","Wall Display"]],
  supervisor: [["home","Home"],["overview","Overview"],["ordering","Ordering"],["calendar","Service Calendar"],["assignments","Assignments"],["wall","Wall Display"]],
  fleet: [["home","Home"],["board","Work Board"],["ordering","Ordering"],["calendar","Service Calendar"],["assignments","Assignments"],["repo","Reference"],["wall","Wall Display"]],
  command: [["home","Home"],["overview","Overview"],["budget","Budget Forecast"],["repo","Reference"],["wall","Wall Display"]],
  admin: [["home","Home"],["board","Work Board"],["ordering","Ordering"],["repo","Reference"],["wall","Wall Display"]]
};
var ROLES = [["officer","Officer"],["supervisor","Supervisor"],["fleet","Fleet lead"],["command","Executive"],["admin","Technology Operations"]];
function allowed(p){return (NAV[S.role]||NAV.officer).some(function(n){return n[0]===p})}
function canMove(){return S.role==="fleet"||S.role==="admin"}

/* ---------- helpers ---------- */
function $(id){return document.getElementById(id)}
function esc(x){return String(x==null?"":x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function key(v){return v.u+"|"+v.c}
function findVeh(k){return VEH.filter(function(v){return key(v)===k})[0]||null}
function parseD(s){
  s=String(s||"").trim(); var m;
  if((m=s.match(/^(\d{4})-(\d{2})-(\d{2})/)))return new Date(+m[1],+m[2]-1,+m[3]);
  if((m=s.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/))){var y=+m[3]; if(y<100)y+=2000; return new Date(y,+m[1]-1,+m[2])}
  return null;
}
function fmtD(d){return d?(d.getMonth()+1)+"/"+d.getDate()+"/"+String(d.getFullYear()).slice(2):""}
function isoD(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}

function status(v){

function unitType(v){

function shiftNow(c){var L=shiftList(c),h=new Date().getHours(),i=(h>=7&&h<15)?0:(h>=15&&h<23)?1:2;return (L[i]||L[0])}
function todayKey(){return isoD(new Date())}
function assignFor(v,day,sh){var A=D.ASSIGN[day]||{},B=A[sh]||{};return B[v.u+v.c]||null}

function nowLabel(){var d=S.now;return d.toLocaleDateString("en-US",{month:"numeric",day:"numeric",year:"2-digit"})+" \u00b7 "+d.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"})}

function unitSort(a,b){var x=parseInt(a.u,10),y=parseInt(b.u,10);if(isNaN(x)&&isNaN(y))return String(a.u).localeCompare(String(b.u));if(isNaN(x))return 1;if(isNaN(y))return -1;return x-y}

/* package on file for a vehicle, by unit and role. No match means none on
   file, never a borrowed patrol package. */
function pkgKey(v){
  var r=String(v.role||""), c=v.c;
  if(c==="Ann Arbor"){
    if(/parking/i.test(r))return "aap:park";
    if(/k-?9/i.test(r))return "aa:k9"; if(/chief/i.test(r))return "aa:chief";
    if(/supervisor|command/i.test(r))return "aa:super"; if(/ciu/i.test(r))return "aa:ciu";
    if(/transport/i.test(r))return "aa:trans"; if(/motorcycle|harley/i.test(r+v.model))return "aa:moto";
    if(/pool|admin|minivan/i.test(r))return "aa:admin"; if(/utility|trailer|drone|aquad/i.test(r))return "aa:utv";
    if(/patrol|police/i.test(r))return "aa:patrol"; return null;
  }
  if(c==="Dearborn"){ if(/k-?9/i.test(r))return "db:k9"; if(/secur/i.test(r))return "db:sec"; if(/admin|utility/i.test(r))return "db:admin"; if(/patrol|police/i.test(r))return "db:patrol"; return null }
  if(c==="Flint"){ if(/secur/i.test(r))return "fl:sec"; if(/supervisor|command/i.test(r))return "fl:flsuper"; if(/unmarked/i.test(r))return "fl:flun"; if(/admin/i.test(r))return "fl:fladmin"; if(/utility/i.test(r))return "fl:flutv"; if(/patrol|police/i.test(r))return "fl:patrol"; return null }
  if(c==="Michigan Medicine"){ if(/k-?9/i.test(r))return "mm:mmk9"; if(/locksmith/i.test(r))return "mm:lock"; if(/unmarked/i.test(r))return "mm:mmun"; if(/police/i.test(r))return "mm:mmpol"; if(/admin|pool/i.test(r))return "mm:mmadmin"; if(/secur/i.test(r))return "mm:mmsec"; return null }
  if(c==="Housing"){ if(/supervisor/i.test(r))return "ho:hosuper"; if(/admin/i.test(r))return "ho:hoadmin"; return "ho:hosec" }
  if(c==="Museum")return "mu:musec";
  if(c==="Guest Services")return "gs:gsveh";
  if(c==="Protective Services")return "ps:prot";
  return null;
}
var LINE = {ok:["Confirmed",["#EDF7F1","#2A7D46"]],pend:["Pending",["#FDF4DC","#92610A"]],act:["Action needed",["#FDECEC","#C0362C"]],"var":["Variation",["#EEF2FF","#3B4BA8"]],na:["Not applicable",["#F3F4F6","#374151"]]};

function upfitFor(v){

    '<div class="chips" style="margin-top:12px">'+L.map(function(x){return '<button type="button" class="chip'+(x.k===sh?" on":"")+'" data-ashift="'+x.k+'">'+esc(x.n)+(x.h?" \u00b7 "+esc(x.h):"")+'</button>'}).join("")+'</div></div>'+

    (posted||pub?"":'<p class="caveat" style="margin-top:0">Not posted yet for this shift. '+(sup?"Assign vehicles below, then publish.":"Check back once your supervisor publishes it.")+'</p>')+
    (sup?(function(){var n=Object.keys(draftFor(day,sh)).length;return '<div class="pubbar"><span>'+(n?n+' change'+(n>1?"s":"")+' not published yet':'Pick an officer for each vehicle, then publish once.')+'</span>'+
      '<button type="button" class="btn-y" data-act="publish" data-day="'+day+'" data-sh="'+sh+'">'+(pub&&!n?"Republish shift":"Publish shift")+'</button></div>'})():"")+
    '<div class="grid">'+cars.map(function(v){

/* ---------- budget forecast ---------- */
function pgBudget(){
  var fys={}, nodate=0, active=0, thisFY=fyOf(new Date());
  VEH.forEach(function(v){ if(v.stc==="na")return; active++; var d=parseD((v.extra||{}).disposal); if(!d){nodate++;return}
    var fy=fyOf(d); var f=fys[fy]=fys[fy]||{n:0,up:0}; f.n++; f.up+=upfitFor(v)});
  var ys=Object.keys(fys).map(Number).sort(), max=Math.max.apply(null,ys.map(function(y){return fys[y].up}).concat([1]));
  var cur=fys[thisFY], nxt=fys[thisFY+1], tot=ys.reduce(function(t,y){return t+fys[y].up},0), totn=ys.reduce(function(t,y){return t+fys[y].n},0);
  var C=D.COST_EVIDENCE, U=D.UPFIT_BY_ROLE;
  var rates=[["Police patrol",U.patrol],["K-9",U.k9],["Supervisor",U["super"]],["Prisoner transport",U.trans],["Security patrol",U.sec],["Michigan Medicine security",U.mmsec],["Protective Services",U.prot],["Parking enforcement",U.park],["Administrative",U.admin],["Anything unmatched",U.DEFAULT]];
  return '<div class="pagehead"><div class="muted13">University fiscal year runs July 1 to June 30</div><h1>Budget Forecast</h1>'+
    '<p class="lede">Outfitting spend each replacement triggers, by fiscal year, at current package rates. Lease cost is separate. Treat this as a planning range, not a quote.</p>'+
    '<div class="tiles">'+
      '<div class="tile"><span class="muted12">FY'+thisFY+', due now or overdue</span><b>'+(cur?money(cur.up):"$0")+'</b><em>'+(cur?cur.n+" vehicles":"none")+'</em></div>'+
      '<div class="tile"><span class="muted12">FY'+(thisFY+1)+', plan for this</span><b>'+(nxt?money(nxt.up):"$0")+'</b><em>'+(nxt?nxt.n+" vehicles":"none")+'</em></div>'+
      '<div class="tile"><span class="muted12">All years on file</span><b>'+money(tot)+'</b><em>'+totn+' vehicles</em></div>'+
      '<div class="tile warn"><span class="muted12">Not in this forecast</span><b>'+nodate+'</b><em>No usable replacement date</em></div></div></div>'+
    '<div class="sec first"><h2 class="h2s">Upfit spend by fiscal year</h2>'+ys.map(function(y){var f=fys[y];
      return '<div class="bar-row go" data-act="fy" data-y="'+y+'"><span>FY'+y+(y===thisFY?" (current)":"")+'</span><div class="bar-track"><div class="bar-fill" style="width:'+Math.max(4,f.up/max*100)+'%;background:'+(y<=thisFY?"#C0362C":y===thisFY+1?"#FFCB05":"#00274C")+'"></div></div><b>'+money(f.up)+' \u00b7 '+f.n+' vehicles</b></div>'}).join("")+
    '<h2 class="h2s" style="margin-top:40px">What the division pays today for the same vehicle</h2>'+
    '<div class="evid"><div class="ev"><b>'+esc(C.total.fig)+'</b><span>'+esc(C.total.what)+'</span><p>'+esc(C.total.d)+'</p></div>'+
    '<div class="ev"><b>'+esc(C.outfit.fig)+'</b><span>'+esc(C.outfit.what)+'</span><p>'+esc(C.outfit.d)+'</p></div></div>'+
    '<p class="caveat">The outfitting figure holds for vehicles that carry a Police Eq figure on Transportation\u2019s list. The forecast covers '+totn+' of '+active+' active vehicles, so the real figure is higher.</p>'+
    '<h2 class="h2s" style="margin-top:40px">Rates used</h2><div class="table">'+rates.map(function(r){return '<div class="tr"><span>'+esc(r[0])+'</span><b>'+money(r[1])+'</b></div>'}).join("")+'</div></div>';
}

/* ---------- service calendar ---------- */
function pgCalendar(){
  var today=new Date(); today.setHours(0,0,0,0);
  var items=[];
  VEH.forEach(function(v){
    var d=parseD(v.next); if(d)items.push({d:d,v:v,t:"Routine service due",s:v.next});
    (v.log||[]).forEach(function(l){ if(l.t==="oil"){var dd=parseD(l.d); if(dd&&dd>=today)items.push({d:dd,v:v,t:l.b,s:l.s||""})} });
  });
  items.sort(function(a,b){return a.d-b.d});
  var over=items.filter(function(i){return i.d<today}), up=items.filter(function(i){return i.d>=today});
  function rows(L){return '<div class="list">'+L.map(function(i){
    return '<button type="button" class="row" data-act="veh" data-k="'+esc(key(i.v))+'"><b>'+fmtD(i.d)+'</b><span>Unit '+esc(i.v.u)+' \u00b7 '+esc(i.v.c)+' \u00b7 '+esc(i.t)+'</span><em>'+esc(i.s)+'</em></button>'}).join("")+'</div>'}
  return '<div class="pagehead"><div class="muted13">'+items.length+' service dates on file</div><h1>Service Calendar</h1>'+
    '<p class="lede">Only vehicles whose records carry a next-service date appear here. Every other vehicle needs that date captured before it can be scheduled.</p></div>'+
    '<div class="sec first"><h2 class="h2s">Overdue</h2>'+(over.length?rows(over):'<p class="empty">Nothing overdue.</p>')+
    '<h2 class="h2s" style="margin-top:40px">Upcoming</h2>'+(up.length?rows(up):'<p class="empty">Nothing scheduled.</p>')+
    '<h2 class="h2s" style="margin-top:40px">Where each job goes</h2><div class="table">'+D.ROUTES.map(function(r){
      return '<div class="tr c4"><span>'+esc(r[0])+'</span><b>'+esc(r[1])+'</b><span>'+esc(r[2])+'</span><span class="muted12">'+esc(r[3])+'</span></div>'}).join("")+'</div></div>';
}

  }

    var e=v.extra||{}, open=openWork(v), pk2=pkgKey(v);

      .filter(function(f){return f[1]&&f[1]!=="\u00b7"});

        (canMove()?'<div class="seg mt">'+D.STAGES.map(function(st){return '<button type="button" class="'+seg(stageOf(l)===st[0])+'" data-act="stage" data-k="'+esc(m.k)+'" data-i="'+li+'" data-g="'+st[0]+'">'+esc(st[1])+'</button>'}).join("")+'</div>'
          :'<em class="muted12">'+esc(stageName(stageOf(l)))+'</em>')+'</div>'}).join("")+'</div>':'<p class="empty">Nothing open on this vehicle.</p>'),
      '<button type="button" class="btn-o" data-act="report" data-k="'+esc(m.k)+'">Place a work order</button>'+

    if(S.role==="supervisor"||S.role==="fleet")opts.push(["assignpage","Change a vehicle assignment","Put an officer in a vehicle, move them, or clear it."]);

    return shell("DPSS Fleet","New Work Order","Pick the type of work. Each one routes differently.",
      '<div class="intake">'+opts.map(function(o){return '<button type="button" class="int" data-act="intake" data-i="'+o[0]+'"><b>'+esc(o[1])+'</b><span>'+esc(o[2])+'</span></button>'}).join("")+'</div>');
  }
  if(m.type==="report"||m.type==="service"){
    var list=VEH.filter(function(x){return atLoc(x.c)}).sort(unitSort);
    var svc=m.type==="service";
    return shell(S.loc, svc?"Work Order: Routine Service":"Work Order: Vehicle Problem", svc?"Book preventative maintenance against a vehicle.":"Anything that takes the vehicle off the road marks it out of service.",

      (svc?'<label class="fl">Service date<input id="rDate" type="date"></label>':
       '<div class="fl">What is affected<div class="seg">'+D.SEV_SYS.map(function(o){
         return '<button type="button" class="'+seg(m.sys===o[0])+'" data-act="sys" data-s="'+o[0]+'">'+esc(o[1])+'</button>'}).join("")+'</div></div>'+

    return shell("Budget Forecast","FY"+m.y+" replacements",L.length+" vehicles, upfit at current package rates.",'<div class="list">'+L.map(function(v){

  marked.forEach(function(n){

function sendWork(svc){

function assistant(q){
  var parts=String(q).split(/\?|\.\s|;|\balso\b|\bplus\b|\band then\b/i).map(function(x){return x.trim()}).filter(function(x){return x.length>1});
  if(!parts.length)return null;
  var whole=parseQ(q), seen={}, secs=[], docs={};
  parts.forEach(function(p){var P=parseQ(p); if(!P.locs.length)P.locs=whole.locs; if(!P.when)P.when=whole.when; if(!P.fy)P.fy=whole.fy;
    if(!P.intents.length&&P.units.length+P.people.length===0)return;
    P.intents.forEach(function(i){var sig=i+"|"+P.locs.join(",")+"|"+P.units.join(",")+"|"+P.people.join(",")+"|"+(P.when||"")+"|"+(P.fy||"");
      if(seen[sig])return; seen[sig]=1;
      var r=SECTIONS[i](P); (Array.isArray(r)?r:[r]).forEach(function(x){if(x){secs.push(x);(x.docs||[]).forEach(function(d){docs[d]=1})}})});
  });
  DOCS.forEach(function(d){if(d.kw.test(whole.lo))docs[d.id]=1});
  (D.DOCLINKS||[]).forEach(function(d){if(d.kw&&d.kw.split(/,\s*/).some(function(w){return w&&whole.lo.indexOf(w.toLowerCase())>=0}))docs[d.id]=1});
  if(!secs.length){
    var ws=whole.lo.split(/\W+/).filter(function(w){return w.length>3});
    var ct=D.CONTACTS.concat(D.ROUTES).filter(function(x){return ws.some(function(w){return x.join(" ").toLowerCase().indexOf(w)>=0})});
    if(ct.length)secs.push({title:"Contacts and routing",summary:ct[0][0]+": "+ct[0][1]+" ("+ct[0][3]+").",cols:["Topic","Who","How","Contact"],rows:ct,docs:["teams"]});
  }
  var sum=secs.length>1?secs.map(function(s){return (s.summary.split(/\.\s/)[0].replace(/\.$/,"")+".")}).join(" "):"";
  return {summary:sum,sections:secs,docs:Object.keys(docs)};
}

    '<div class="wnav"><button type="button" class="wbtn" data-wstep="-1"'+(si<=0?" disabled":"")+'>\u2190 Earlier</button>'+
      slots.slice(0,Math.max(4,shiftList(c).length)).map(function(s,i){return '<button type="button" class="wbtn'+(i===si?" on":"")+'" data-wslot="'+i+'">'+esc(i===0?"Now":slotName(s))+'</button>'}).join("")+
      '<button type="button" class="wbtn" data-wstep="1"'+(si>=slots.length-1?" disabled":"")+'>Later \u2192</button>'+
      (si>0?'<button type="button" class="wbtn now" data-wslot="0">Back to now</button>':'')+
      '<button type="button" class="wbtn full" data-act="wallfull">'+(S.wallFull?"Exit full screen":"Full screen")+'</button></div>'+
    '<div class="wcounts">'+[[live?"In use":"Assigned",use.length,"use"],["Later shift",later.length,"later"],["Available",free.length,"free"],["Out of service",down.length,"down"]].map(function(k){
      return '<div class="wc '+k[2]+'"><b>'+k[1]+'</b><span>'+k[0]+'</span></div>'}).join("")+'</div>'+
    seg(live?"In use":"Assigned","On the posted sheet for this shift",use,"use")+
    seg("Assigned to a later shift","Free now, set aside for an upcoming shift",later,"later")+
    seg("Available for use","Free to take out, with where it is kept",free,"free")+
    seg("Out of service","Not to be driven",down,"down")+
    (nokey.length?seg("No unit number","On record but not yet numbered",nokey,"none"):"")+
    (c!=="Ann Arbor"?'<p class="wnote">Assignments for '+esc(c)+' appear once a roster is posted.</p>':'')+'</div>';
}

(function(){var h=(location.hash||"").slice(1); if(h)S.page=h})();
setInterval(function(){S.now=new Date(); if(!S.modal)render()},30000);
render();
</script>
</body></html>
